cargo-features = ["codegen-backend"]

[workspace]
resolver = "3"
members  = [
    "crates/lce",
    "crates/lce_*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]

[workspace.dependencies.bevy]
version          = "0.18"
default-features = false
features         = ["3d"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic   = "warn"
nursery    = "warn"
suspicious = "warn"
complexity = "warn"
perf       = "warn"

[profile.release]
opt-level       = 3
debug           = 0
strip           = true
overflow-checks = false
lto             = "thin"
panic           = "abort"
incremental     = false
codegen-units   = 1

[profile.dev]
opt-level       = 1
codegen-backend = "cranelift"

[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"
